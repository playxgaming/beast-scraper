[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beast-scraper"
version = "0.1.0"
description = "Self-hosted scraping API combining tiered web scraping (curl_cffi + Playwright + Trafilatura), multi-page crawling, research papers (OpenAlex/arXiv/S2 + PyMuPDF4LLM), YouTube (yt-dlp + transcripts), web search (SearXNG/DDGS), and proxy rotation."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.2",
    "curl-cffi>=0.7.0",
    "playwright>=1.48.0",
    "trafilatura>=1.12.2",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "markdownify>=0.13.1",
    "pymupdf>=1.24.10,<2",
    "yt-dlp>=2024.10.0",
    "youtube-transcript-api>=1.0.0",
    "ddgs>=8.0.0",
    "aiosqlite>=0.20.0",
    "pysocks>=1.7.1",
]

[project.optional-dependencies]
pdf = ["pymupdf4llm>=0.0.17,<1"]
pro = [
    "crawl4ai>=0.4.0",
    "scrapling[fetchers]>=0.2.9",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "build>=1.2.0",
    "ruff>=0.9.0",
]

[project.scripts]
beast-scraper = "beast_scraper.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["beast_scraper*"]

[tool.setuptools.package-data]
beast_scraper = ["static/*.html"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
